name: 每日全市場（收盤行情／三大法人）

# 四個請求，換到整個市場的當日收盤與法人買賣超。
#
# 這是〈架構檢討〉裡最貴的那一格落差：今天的收盤價原本要按一次按鈕、抓 13 頁才
# 換到**一檔**，而交易所一個請求就給整個市場。1,741 檔 × 一天一次，和 4 個請求
# 一天兩次，是同一件事的兩種做法。
#
# 為什麼一天跑兩次：
#
#   實測（台北時間 16:12）證交所的 openapi 還停在**前一個交易日**，而櫃買已經是
#   當天的。所以早的那一輪先把櫃買存下來，晚的那一輪補上市——檔名是每一列自己帶
#   的日期，不是抓取當天，所以兩輪寫進的是不同的檔案，不會互相蓋掉。
#
#   同一份資料重抓不會製造 commit：gzip 固定 mtime=0、列先排序，所以位元組一樣。
#
# 存完之後就建站發布：個股頁的市價、報酬風險比、九宮格的第二行、河流圖今天那一
# 點，全部讀這份資料。這就是「每天打開網頁都是最新的，不用按更新」的最後一格。
#
# 增量建站只會重畫**有完整版**的那些（表格版的頁面上沒有市價，價格不算進它的
# 指紋），所以每天重畫的張數等於觀察清單的大小，不是 1,742。

on:
  schedule:
    # 台北 17:30 與 23:30。前者趕在盤後資訊上站之後，後者收尾。
    - cron: "30 9 * * 1-5"
    - cron: "30 15 * * 1-5"
  workflow_dispatch:
    inputs:
      yearly_limit:
        description: "年度交易資訊：這一輪最多補幾檔（預設 40。要一次排乾就填 300）"
        required: false
        default: "40"

permissions:
  contents: write
  # 建站與發布在同一個 job 裡做：用 GITHUB_TOKEN 推的 commit 不會觸發 pages.yml。
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 建站要 jinja2，所以是 [report] 而不是裸的 .
      - run: pip install -e ".[report]"

      - name: 抓取
        run: twsix fetch-daily

      # 補上前幾天沒抓齊的。
      #
      # 兩個交易所各自可能掛掉，掛掉的那天留下的是一份**只有半個市場**的檔案
      # ——一千多列，看起來很正常。這兩支都只補「還沒有兩市俱全的日期」，
      # 已經齊的那些一次都不連網，所以穩定狀態下這一步幾乎不花時間。
      #
      # `|| true`：補歷史失敗不該擋住今天的資料進版控。
      - name: 補齊最近幾天
        run: |
          twsix backfill-prices --days 5 || true
          twsix backfill-institutional --days 5 || true

      # 〔年度交易資訊〕與〔季財報〕：從 ownership-drain.yml 搬過來的。
      #
      # 它們原本住在那個名字寫著「一次性排乾」的檔案裡，而它們做的是**常態維護**：
      # 每上市一檔新股票就多一份年度資訊要補，每過一季就多一期財報要抓。放在那裡，
      # 「刪掉排乾」和「弄丟兩件每天都要做的事」就綁在一起了——而那正是這個 repo
      # 一再踩到的同一種坑：一件永久的事寄住在一個暫時的地方。
      #
      # 兩支都只補「還沒有的那些」，已經有的完全不連網，所以穩定狀態下這一步是
      # 零個請求、幾秒鐘。一天跑兩次也沒有負擔。
      #
      # `--limit 40`：這裡不是用來排乾的（那是排乾那條的工作），是用來接住新上市
      # 的那幾檔。給一個小上限，是因為這個 job 還要建站與發布，不該被一次大回補
      # 撐爆 timeout。
      #
      # `|| true`：補歷史失敗不該擋住今天的行情進版控。
      - name: 補齊年度交易資訊與季財報
        env:
          # ⚠️ 這個 '40' 要和上面 inputs.yearly_limit 的 default 一模一樣。
          #
          # 它們不一樣的時候不會有任何錯誤——排程用的是這裡的值，說明文字寫的是
          # 上面那個，於是「每晚補幾檔」和「畫面上寫每晚補幾檔」是兩個數字。
          # ownership-drain.yml 上一版就是這樣：說明寫 300、input default 300、
          # 這裡寫 60，而排程觸發時 inputs 是空的，所以實際每晚只補 60。249 檔
          # 因此排了五個晚上而不是一個，帳面上卻完全正常。
          YEARLY_LIMIT: ${{ github.event.inputs.yearly_limit || '40' }}
        run: |
          twsix backfill-yearly --limit "$YEARLY_LIMIT" || true
          twsix backfill-statements --quarters 12 || true

      - name: Commit
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/sheets 與 data/market 全都要加：上面那一步會寫〔年度交易資訊〕
          # （進 data/sheets/<代號>/）與季財報彙總（進 data/market/*_income 等）。
          # 只加 data/market/daily 的話，下面那道「被改到但沒被 commit」的檢查會
          # 讓整趟紅掉——而那道檢查正是為了這種情況存在的。
          git add data/market data/sheets
          if git diff --cached --quiet; then
            # 非交易日、或這一輪抓到的和上一輪一模一樣——都是正常的，不是失敗。
            echo "::notice::沒有新的一天要存"
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=yes" >> "$GITHUB_OUTPUT"
          days="$(git diff --cached --name-only -- data/market/daily \
                  | sed 's#.*/##; s#\.csv\.gz$##' | sort -u | paste -sd' ' -)"
          git commit -m "每日行情：${days:-$(date -u +%Y-%m-%d)}" \
                     -m "全市場收盤與三大法人買賣超，四個請求。"
          if ! git diff --quiet; then
            echo "::error::這些檔案被改到了但沒有被 commit，請把它們加進上面的 git add："
            git diff --name-only | sed 's/^/  /'
            exit 1
          fi

      # 推送單獨拆成一步，用共用的重試 action。這條排程原本是裸的
      # `git pull --rebase; git push`，撞上另一條 workflow 就整趟的抓取結果一起
      # 丟掉——見 .github/actions/push-with-retry 的說明。
      - name: 推送
        if: steps.commit.outputs.changed == 'yes'
        uses: ./.github/actions/push-with-retry

      # 價格進了 repo，網頁還沒換。這兩步讓今天的收盤當天就出現在個股頁上。
      - name: 建站
        if: steps.commit.outputs.changed == 'yes'
        uses: ./.github/actions/build-site
        with:
          test: "false"
          setup: "false"   # 上面已經 setup 過了
          incremental: "true"

      - name: 發布
        id: deployment
        if: steps.commit.outputs.changed == 'yes'
        uses: actions/deploy-pages@v4
