name: daily-prices

# 台股 13:30 收盤，盤後資料約 15:00 齊全。
on:
  schedule:
    - cron: "0 8 * * 1-5"          # UTC 08:00 ≈ 台北 16:00，週一至週五
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[all]"

      - name: 是否為交易日
        id: trading
        run: |
          # 開放資料在假日會回空陣列，不必特別判斷行事曆——抓到空的就跳過。
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: 抓收盤價
        if: steps.trading.outputs.proceed == 'true'
        run: twsix fetch --companies

      - name: 重建網站
        run: twsix build

      - name: 提交資料快照
        run: |
          git config user.name  "twsix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "資料無異動" && exit 0
          git commit -m "data: $(date -u +%Y-%m-%d) 收盤更新"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
