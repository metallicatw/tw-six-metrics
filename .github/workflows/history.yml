name: 回補歷史股價（股價健診用）

# 個股頁〔股價健診〕要畫 500 個交易日的總評分，而第一天就要有年線（240MA）——
# 所以要 760 個交易日的每日收盤。每日排程是 2025-09 才開始累積的，只有兩百多天。
#
# 這一條是**手動**跑的：一次把缺的日子補齊（兩個交易所各一個請求、一天兩個，
# 五百天約一小時）。之後每日排程每天加一天、`backfill-prices --days 5` 補前幾天
# 沒抓齊的，歷史就一直是齊的，不必再跑這一條。
#
# 可以重跑：只補「還沒有、或只有半個市場」的日子，已經齊的那幾天一次都不連網。
# 中途被限速、某一天只拿到上櫃，下一次跑會看到它只有半個市場而補另一半。

on:
  workflow_dispatch:
    inputs:
      days:
        description: "要補到幾個交易日（預設 760 ＝ 500 天的圖＋240 天的年線）"
        required: false
        default: "760"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[report]"

      # 抓回來的東西要 commit 進 repo，先確認引擎是好的（bot 的 push 不觸發 ci.yml）。
      - name: 測試
        run: python scripts/run_tests.py

      # 手動觸發時是使用者填的自由文字；走 env，而且只收正整數。
      - name: 回補
        env:
          IN_DAYS: ${{ inputs.days || 760 }}
        run: |
          case "$IN_DAYS" in
            ''|*[!0-9]*)
              echo "::error::「要補到幾個交易日」只能是正整數，收到的是：$IN_DAYS"
              exit 1 ;;
          esac
          # 3 秒一個請求：證交所連續打太快會回 307。
          twsix backfill-prices --days "$IN_DAYS" --pause 3

      - name: Commit
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/daily/prices
          # 守門：白名單以外有東西被改到，就是引擎寫了一個這裡沒想到的檔案。
          if ! git diff --quiet; then
            echo "::error::這些檔案被改到了但沒有被 commit，請把它們加進上面的 git add："
            git diff --name-only | sed 's/^/  /'
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "::notice::沒有缺的日子，歷史已經是齊的"
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(git diff --cached --name-only | wc -l)
          git commit -m "回補歷史股價：$n 個交易日" \
                     -m "每日全市場收盤，給個股頁〔股價健診〕與〔推估三年目標價〕的圖。"

      - name: 推送
        if: steps.commit.outputs.changed != 'no'
        uses: ./.github/actions/push-with-retry

      # 回補的是**舊的**日子：個股頁的指紋裡有那一段歷史的長度與第一天
      # （build.py 的 stock_signature），所以增量建站會重畫每一頁。
      - name: 建站
        if: steps.commit.outputs.changed != 'no'
        uses: ./.github/actions/build-site
        with:
          incremental: "true"
          test: "false"
          setup: "false"

      - name: 發布
        if: steps.commit.outputs.changed != 'no'
        id: deployment
        uses: actions/deploy-pages@v4
