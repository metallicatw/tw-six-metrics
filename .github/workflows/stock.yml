name: 加一檔個股

# 在網頁上輸入股票代號，抓完資料、產出完整報告、併進網站。
#
# 這是 `twsix report <代號> --rebuild` 的線上版。存在的理由是「輸入一檔代號，
# 跑出完整報告」不該需要一台裝好 Python 的電腦。
#
# 券商鏡像站擋不擋 GitHub runner，一度是這條路唯一的未知數。已經實測過了：
# 3029 由這個 workflow 抓成功並 commit 進來（作者是 github-actions[bot]），
# 所以鏡像站對 runner 的機房 IP 是放行的。
#
# 被擋的話這個 workflow 會紅字失敗並說原因，不會默默產生一份空報告；那時就
# 退回本機跑 `twsix serve` 或 `twsix report`。
#
# Goodinfo 是另一回事：它對機房 IP 回 403，實測過。所以〔大戶持股〕〔董監持股〕
# 不在這條路上，也不在本機以外的任何一條路上。

on:
  # 網頁上那顆「抓這一檔」開的就是這個：一張標題只有股號的 issue。
  # 這是靜態網站唯一能觸發抓取的方式——issue 網址可以預先填好標題與標籤，
  # 所以對使用者是一次點擊加一次送出，手機上也一樣。workflow_dispatch 留著，
  # 給想直接在 Actions 分頁跑的人。
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      stock:
        description: "股票代號（例如 2330）。一次一檔。"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  # 建站與上傳 Pages artifact 現在就在這個 job 裡做，不再叫醒第二台 runner。
  pages: write
  id-token: write

concurrency:
  group: add-stock
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 只有能寫這個 repo 的人開的 issue 才算數。少了這一行，任何人都可以用
    # issue 叫這個 repo 去跑 Actions——那是一個開給全世界的免費運算後門。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.issue.author_association))
    steps:
      - uses: actions/checkout@v4

      - name: 讀出股號
        id: pick
        env:
          TITLE: ${{ github.event.issue.title }}
          INPUT: ${{ inputs.stock }}
        run: |
          raw="${INPUT:-$TITLE}"
          # 標題就是股號，但人多半會順手加空白或全形字；只取第一串數字。
          code=$(printf '%s' "$raw" | tr -cd '0-9 ' | tr -s ' ' | awk '{print $1}')
          if ! printf '%s' "$code" | grep -Eq '^[0-9]{4,6}$'; then
            echo "::error::「$raw」裡找不到 4~6 位數字的股號"
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[report]"

      # 測試與抓取同時跑。
      #
      # 兩件事都得做：抓回來的資料要 commit 進 repo，用一個壞掉的引擎去解析等於
      # 把垃圾存成事實；而抓取本身是等網路，CPU 幾乎閒著。排成一列就是白等
      # 二十幾秒——那二十幾秒是使用者按下按鈕之後真的在看著螢幕的時間。
      #
      # 先確定引擎能載入（import 失敗的話連抓都不必抓），再把整套測試丟到背景，
      # 抓完之後 wait 它。任何一邊失敗，這一步就失敗，沒有資料會被 commit。
      #
      # report 會順便向集保補這一檔的 51 週股權歷史（第一次約一分鐘，之後只補
      # 新的那一週）。沒有那一年的走勢，〔大戶持股〕只有一個點。
      - name: 測試並抓取
        run: |
          python -c "import twsix.cli"
          python scripts/run_tests.py > /tmp/tests.log 2>&1 &
          tests=$!
          set +e
          twsix report "${{ steps.pick.outputs.code }}"
          fetch=$?
          wait "$tests"
          suite=$?
          set -e
          echo "----- 測試 -----"
          tail -n 20 /tmp/tests.log
          if [ "$suite" -ne 0 ]; then
            echo "::error::測試沒過，不 commit 這次抓到的資料"
            exit 1
          fi
          exit "$fetch"

      - name: Commit
        run: |
          code="${{ steps.pick.outputs.code }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 集保的 51 週歷史和董監的月線都是逐檔問來的，和個股表一起 commit
          # ——否則下次在 runner 上跑同一檔又要重問一次。董監那一份還包含
          # `.floor`：記著「比這個月更早就查無資料」，沒有它，一檔近年才上市的
          # 股票每次更新都要花半分鐘重新確認上市之前確實沒有資料。
          git add "data/sheets/$code" \
                  "data/ownership/stock/$code.csv.gz" \
                  "data/ownership/directors_stock/$code."* || true
          if git diff --cached --quiet; then
            echo "::notice::$code 的資料沒有變化，不需要 commit"
            exit 0
          fi
          git commit -m "watchlist: $code" -m "由「加一檔個股」workflow 抓取。"
          # 這期間可能有別的 commit 進來（例如另一次抓取），rebase 再推。
          git pull --rebase origin main
          git push origin HEAD:main

      # 建站就在這裡做。以前這一步是 `uses: ./.github/workflows/pages.yml`，
      # 也就是叫醒第二台 runner，重跑一次 checkout + setup-python + pip install
      # + 298 個測試，只為了那四秒的 build。使用者等的時間裡，那段開機成本比
      # 抓資料本身還長。工作區這時已經 rebase 到 main 的頂端，資料是新的。
      #
      # 測試上面剛跑過同一份程式碼，不重跑。
      - name: 建站
        uses: ./.github/actions/build-site
        with:
          test: "false"

      - name: 說明
        env:
          CODE: ${{ steps.pick.outputs.code }}
        run: |
          url="https://metallicatw.github.io/tw-six-metrics/stock/$CODE.html"
          {
            echo "### $CODE 已加入觀察清單"
            echo ""
            echo "接下來 publish 工作會重建並發布網站，完成後在這裡："
            echo ""
            echo "<$url>"
          } >> "$GITHUB_STEP_SUMMARY"

      # 開 issue 的人不必回來看 Actions 才知道成功——留言並關閉，通知會自己送到。
      - name: 回覆並關閉 issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.pick.outputs.code }}
          NUM: ${{ github.event.issue.number }}
        run: |
          url="https://metallicatw.github.io/tw-six-metrics/stock/$CODE.html"
          gh issue comment "$NUM" --body "$CODE 抓好了，網站重建完成後在這裡：$url

          （網頁上那一頁會自己跳過去，不用手動重新整理。）"
          gh issue close "$NUM"

      - name: 失敗時也說一聲
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$NUM" --body "抓取失敗了，詳情在這次執行紀錄：$RUN

          常見原因：股號不存在、或券商鏡像站當下拒絕連線。過幾分鐘重開一張就好。"

  # 發布。artifact 上一個 job 已經傳好了，這裡只按下發布鍵——沒有 checkout、
  # 沒有 Python，十幾秒就結束。
  #
  # 為什麼還要獨立一個 job：deploy-pages 必須跑在綁 `github-pages` environment
  # 的 job 裡，而那個 job 不該同時握有 contents: write。
  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
