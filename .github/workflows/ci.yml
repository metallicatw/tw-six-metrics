name: ci

on:
  push:
    branches: [main]
    # 只改文件不必跑整套測試與 lint。資料的改動**照跑**：測試裡有好幾條在守資料
    # 本身的規則（分頁不能有未壓縮的、評等表的欄位形狀、端點樣本的長相），跳過
    # 它們等於把最容易悄悄壞掉的那一類改動放行。
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The engine is standard-library only, so it must pass before anything
      # is installed.  If this step ever needs a dependency, that is a bug.
      - name: 零相依測試
        run: python scripts/run_tests.py

      - name: 安裝開發相依
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: ruff
        run: ruff check src tests scripts

      - name: mypy
        run: mypy || true      # advisory for now; tighten once annotations settle

      - name: pytest
        run: pytest

      - name: 端對端冒煙測試
        run: |
          twsix show-rules
          twsix verify
          twsix value --golden 5439
