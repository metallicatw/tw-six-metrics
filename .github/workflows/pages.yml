name: pages

# 只做一件事：建站並發布。
#
# 先前有 daily / monthly / quarterly 三個排程在跑全市場抓取，但它們做不到
# 宣稱的事：
#
#   * 官方 OpenAPI（t187ap05/06/07）每家公司只給**最新一期**一列。六大指標
#     要 4~6 期歷史，一期快照一個指標都算不出來。
#   * 那批端點裡沒有現金流量表，所以自由現金流量從這條路永遠算不出來。
#   * `twsix rate` 沒有 --workbook 會直接失敗，而 CI 裡不可能有活頁簿
#     （.xlsm 已被 gitignore）。三個排程都寫成 `twsix rate || true`，
#     於是每一次都失敗、每一次都被吞掉。
#
# 結果是每天 commit 六千多行沒有任何東西讀的快照。移除它們不是放棄功能，
# 是移除從未運作過的東西。抓取改由本機的 `twsix fetch-stock` 單檔查詢負責，
# 那條路才碰得到券商鏡像站上的股價、本益比與股利。

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "reference/**"
  # 兩個排程，各接一個上游 repo。兩者都是「那邊產完，這邊過一會兒帶進來」——
  # 沒有這兩條，那兩頁要等到這裡因為別的理由重建才會換，最差落後一整天。
  #
  #   23:10 UTC（台北隔日 07:10）  market-monitor 22:30 UTC 產完，四十分鐘後
  #   08:00 UTC（台北 16:00）      tw-trend-filter 07:10 UTC 產完，五十分鐘後
  #
  # 趨勢那一條只排週一到週五：週末沒有收盤價，上游本來就不跑。
  schedule:
    - cron: "10 23 * * 0-4"
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

# 注意：這裡已經沒有 workflow_call 了。
#
# 抓取的兩個 workflow 以前是 call 這一份，而 workflow_call 起的是另一台 runner：
# 重新排隊、重新 checkout、重新裝一次相依、重新跑一次剛跑過的測試，全部只為了
# 那四秒的 `twsix build`。它們現在改成在自己的 job 裡用
# `./.github/actions/build-site`——同一份建站定義，少一次開機。

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/build-site
        with:
          incremental: "true"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
