name: pages

# 只做一件事：建站並發布。
#
# 先前有 daily / monthly / quarterly 三個排程在跑全市場抓取，但它們做不到
# 宣稱的事：
#
#   * 官方 OpenAPI（t187ap05/06/07）每家公司只給**最新一期**一列。六大指標
#     要 4~6 期歷史，一期快照一個指標都算不出來。
#   * 那批端點裡沒有現金流量表，所以自由現金流量從這條路永遠算不出來。
#   * `twsix rate` 沒有 --workbook 會直接失敗，而 CI 裡不可能有活頁簿
#     （.xlsm 已被 gitignore）。三個排程都寫成 `twsix rate || true`，
#     於是每一次都失敗、每一次都被吞掉。
#
# 結果是每天 commit 六千多行沒有任何東西讀的快照。移除它們不是放棄功能，
# 是移除從未運作過的東西。抓取改由本機的 `twsix fetch-stock` 單檔查詢負責，
# 那條路才碰得到券商鏡像站上的股價、本益比與股利。

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "reference/**"
  # 兩個排程，各接一個上游 repo。兩者都是「那邊產完，這邊過一會兒帶進來」——
  # 沒有這兩條，那兩頁要等到這裡因為別的理由重建才會換，最差落後一整天。
  #
  #   23:37 UTC（台北隔日 07:37）  market-monitor 22:23 UTC 產完，74 分鐘後
  #   08:47 UTC（台北 16:47）      tw-trend-filter 07:07 UTC 產完，100 分鐘後
  #
  # 緩衝從 40／50 分鐘拉到 74／100 分鐘。理由是 GitHub 的排程漂移：五分鐘是常態、
  # 整點前後十五分鐘常見、忙的日子三十分鐘以上。上游晚一點、這邊早一點，兩邊各
  # 漂半個小時就會交叉——而交叉的結果是**這裡抓到昨天那一份，然後一切正常地發布
  # 出去**（`build-site` 抓不到新的只會留一條 ::warning::，沿用快取裡的上一份）。
  #
  # 這仍然是在用「等 N 分鐘」猜。真正的修法是讓上游做完之後主動叫這邊
  # （`repository_dispatch`），排程退化成上游整個沒跑時的保險。那要在上游放一把
  # PAT，是另一件事。
  #
  # 週幾也跟著上游走：
  #
  #   * market-monitor 那一條改成 `0-5`（週日～週五 UTC ＝ 台北週一～週六）。
  #     上游加了週五那一班，好讓週末看得到週五的美股收盤——這裡不跟著加的話，
  #     它產出來的那一份要等到週一早上才會進主站，等於白加。
  #   * 趨勢那一條維持週一到週五：週末沒有收盤價，上游本來就不跑。
  #
  # 分鐘一律避開整點與圓整數（`:00` 是最擠的那一分鐘，而 `08:00` 又緊鄰
  # 09:00–10:00 UTC 這個平台尖峰）。
  schedule:
    - cron: "37 23 * * 0-5"
    - cron: "47 8 * * 1-5"
  workflow_dispatch:

# 注意：這裡已經沒有 workflow_call 了。
#
# 抓取的兩個 workflow 以前是 call 這一份，而 workflow_call 起的是另一台 runner：
# 重新排隊、重新 checkout、重新裝一次相依、重新跑一次剛跑過的測試，全部只為了
# 那四秒的 `twsix build`。它們現在改成在自己的 job 裡用
# `./.github/actions/build-site`——同一份建站定義，少一次開機。

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/build-site
        with:
          incremental: "true"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
