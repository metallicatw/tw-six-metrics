name: 評等補課（清單上過期的那些）

# 〔評等清單〕上 1,741 檔裡，有 1,558 檔還停在活頁簿匯入的 2025.2Q——比首頁上
# 那 183 檔整整舊了一年。這條排程一批一批把它們換成新的。
#
# 為什麼不是「全市場官方資料」那條路就好：
#
#   官方開放資料的資產負債表沒有存貨，也完全沒有現金流量表。六大指標裡的存貨
#   週轉率與自由現金流量，那條路拿不到——不是還沒寫，是來源裡沒有。而且官方季報
#   只給最新一期、沒有日期參數，所以九期只能往前累積，第二個資料點要等三個月。
#
#   券商鏡像則是一次給九季、六個指標全有，而且已經被證明可行：首頁上那 183 檔
#   就是這樣抓來的，其中 3029 是由 runner 抓的。
#
# 為什麼補課要把原始分頁留下來：
#
#   第一版是抓完就刪，理由是未壓縮每檔 256 KB、1,741 檔等於 446 MB 進版控。
#   代價是那些股票只有〔六大財務指標評等〕一頁——另外三頁（評價簡表、EPS預估與
#   估價、殖利率估價）需要原始分頁當原料。
#
#   改法不是少存，是壓縮：gzip 之後實測平均每檔 34 KB，全市場約 57 MB。留原始
#   分頁而不是只留四頁用得到的數字（那樣只要 10~17 MB），是因為原始分頁是
#   **來源層**——之後想算的任何東西都不必再跟鏡像站要一次。
#
#   gzip 固定 mtime=0，所以沒變的分頁重寫會得到同一個檔案，不會製造假差異。
#
# 節奏：一天四批、一批 100 檔，1,665 檔約四天走完。之後佇列會自己空掉（每一檔
# 補上就離開），排程照跑但每次都印「清單上沒有落後的股票」，不留 commit。
# 一檔失敗不中斷整批：抓到幾檔就是幾檔，下一批會再遇到它。
#
# 一批 100 檔 = 1,500 個請求，分散在八個券商鏡像站、每站之間節流 1.2 秒，約
# 25 分鐘。一天四批平均下來每個站台大約八秒一個請求——這是「一般讀者的閱讀
# 速度」，不是壓力測試。要更快就加開時段，不要把單批拉大：單批越大，中途被
# 中斷時丟掉的進度越多（補課本身沒有斷點續傳，靠的是佇列每次重新計算）。

on:
  schedule:
    # ## 什麼時候有事做（2026-09-23 重排）
    #
    # 佇列只有在**有公司交出新一季財報、而券商鏡像跟上了**的時候才會長出來：
    #
    #   年報 3/31、Q1 5/15、Q2 8/14、Q3 11/14 截止，鏡像再晚幾天到幾週跟上
    #   → 3～6 月、8～9 月、11～12 月是旺季（一季 1,800 多檔要補）
    #   → 1、2、7、10 月幾乎只有新上市的那幾檔
    #
    # 以前一年到頭一天四班，而 2026-09-11～20 的 17 班裡 16 班是「評等補課：0 列」
    # ——每一班都裝相依、跑測試、抓零檔。現在：
    #
    #   * 旺季一天四班（台北 02:23／08:23／14:23／20:23），100 檔一批，
    #     1,800 檔約五天排乾。
    #   * 淡季一天一班（台北 20:29），接新上市與零星晚交的。
    #   * 每一班開頭先問 `twsix refresh --pending`（不連網）：佇列是空的就到此為止，
    #     不跑測試、不抓、不 commit、不建站。
    #
    # 月份欄位是 UTC 的月份：旺季那一條的 18:23 UTC 是台北隔天 02:23，月底
    # 最後一天那一班會算在下個月的頭上——差一天，無所謂。
    - cron: "23 18,0,6,12 * 3,4,5,6,8,9,11,12 *"
    # 淡季。分鐘和上面那一條錯開（test_schedule 不准同一分鐘兩條）。
    - cron: "29 12 * 1,2,7,10 *"
  workflow_dispatch:
    inputs:
      limit:
        description: "這一批補幾檔"
        required: false
        default: "100"
        type: string

permissions:
  contents: write
  # 建站與發布就在這個 job 裡做。用 GITHUB_TOKEN 推的 commit **不會**觸發別的
  # workflow，所以 pages.yml 的 `on: push` 不會醒——這是 GitHub 防止排程互相
  # 觸發成無窮迴圈的規則，不是設定漏了。「加一檔個股」也是為了這件事自己建站。
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 一批 100 檔約 30~60 分鐘（每檔 15 個請求、站台之間節流 1.2 秒）。給餘裕，
    # 但不給到六小時：卡住的時候應該早點失敗，而不是佔著 runner 到天亮。
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[report]"

      # 有沒有事做。佇列是空的、也沒有舊名字的記號要換，這一班就到此為止：
      # 下面每一步都掛著 `steps.gate.outputs.skip != 'yes'`。手動觸發一律照跑。
      - name: 有沒有要補的
        id: gate
        run: |
          n="$(twsix refresh --pending | tail -1)"
          legacy="$(ls data/sheets/*/_stuck.json 2>/dev/null | wc -l)"
          echo "待補 $n 檔；舊名字的記號 $legacy 個"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$n" = "0" ] && [ "$legacy" = "0" ]; then
            echo "::notice::佇列是空的，這一班不必跑"
            echo "skip=yes" >> "$GITHUB_OUTPUT"
          fi

      # 舊版把「補過但沒進步」的記號寫成 `_stuck.json`，而 data/sheets 底下的
      # .json 會被當成分頁、也會讓下一步的測試紅掉。這一步必須排在測試**前面**：
      # 排在後面的話，測試先紅、job 停下，修它的這一步永遠走不到。
      # 只改記號的檔名，不連網、不動任何分頁。換下來的檔案由下面的 git add data/sheets 帶走。
      - name: 換掉舊名字的記號
        if: steps.gate.outputs.skip != 'yes'
        run: python -c "from pathlib import Path; from twsix.cli import migrate_stuck_marks; print('換掉', migrate_stuck_marks(Path('data')), '個舊記號')"

      # 抓回來的東西要 commit 進 repo，先確認引擎是好的。
      #
      # ⚠️ **bot 的 push 不會觸發 `ci.yml`**（`on: push` 對 GITHUB_TOKEN 推的
      # commit 不生效），所以這條路上沒有第二次機會。每天約十次 bot push 把資料
      # 寫進 main，而測試裡有好幾條是直接對 `data/` 跑的——它們守得住壞資料，
      # 卻在寫入壞資料的那條路上不會被執行。
      #
      # 87 秒，零相依（`ownership.yml` 早就這樣做了）。
      - name: 測試
        if: steps.gate.outputs.skip != 'yes'
        run: python scripts/run_tests.py


      # 每檔 15 個請求（十三張鏡像分頁 + 證交所與櫃買的年度交易資訊）。
      - name: 補課
        if: steps.gate.outputs.skip != 'yes'
        env:
          # 手動觸發時是使用者填的自由文字；走 env 才不會被當成 shell 程式碼。
          IN_LIMIT: ${{ inputs.limit || 100 }}
        run: |
          case "$IN_LIMIT" in
            ''|*[!0-9]*)
              echo "::error::「這一批補幾檔」只能是正整數，收到的是：$IN_LIMIT"
              exit 1 ;;
          esac
          twsix refresh --limit "$IN_LIMIT"

      - name: Commit
        if: steps.gate.outputs.skip != 'yes'
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # delisted.csv 是補課收尾寫的：清單上有、官方名單上沒有的那幾檔。
          # 一週改不到一次，但漏掉它的話標記永遠不會生效，而網站上看不出來。
          git add data/ratings.csv data/sheets data/delisted.csv
          # ⚠️ **守門要在提早 exit 的上面。**
          #
          # 它防的是「引擎寫了一個白名單沒列的檔案」。而它以前排在
          # `changed=no → exit 0` 的**下面**——於是只要白名單裡的檔案剛好都
          # 沒變（非交易日、期別沒換、補課 0 列，這在穩定狀態下是常態），
          # 那個漏掉的檔案一聲不吭地留在 runner 上，job 綠燈。
          #
          # 也就是說這道門在最需要它的那一天（引擎開始寫新檔案的第一天，
          # 而那天多半沒有別的變動）剛好是關著的。
          if ! git diff --quiet; then
            echo "::error::這些檔案被改到了但沒有被 commit，請把它們加進上面的 git add："
            git diff --name-only | sed 's/^/  /'
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "::notice::這一批沒有任何一列改變"
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=yes" >> "$GITHUB_OUTPUT"
          count="$(git diff --cached --numstat -- data/ratings.csv | awk '{print $1}')"
          git commit -m "評等補課：${count:-0} 列" \
                     -m "由券商鏡像重算，原始分頁壓縮存進 data/sheets/。"
          # 白名單式的 git add 會漏掉引擎新寫的檔案，而那件事的症狀是下一行
          # 「cannot pull with rebase: You have unstaged changes」——一句完全不提
          # 檔名的訊息。先自己講清楚。
          # 這一批動到哪幾檔——撞車的時候要用它把評等貼回去。
          codes="$(git diff --name-only HEAD~1 HEAD -- data/sheets \
                   | cut -d/ -f3 | sort -u | paste -sd, -)"
          # 「加一檔個股」和這條排程用不同的 concurrency group，所以它們可以同時
          # 在跑，而且兩邊都寫 data/ratings.csv 與 data/sheets/。不同股票的話
          # CSV 會逐行自動合併；**同一檔**的話 .json.gz 是二進位，git 合不起來，
          # 這一批就整個紅字結束——白抓一小時，而使用者那顆按鈕明明是好的。
          #
          # 所以衝突的時候讓給對方：對方那一版是使用者剛按下按鈕抓回來的，一樣新
          # 或更新，而我們這一批其餘的九十幾檔沒有理由跟著陪葬。被讓掉的那一檔
          # 下一批會重新排到（佇列是每次從資料重算的，不是一份存起來的名單）。
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              conflicted="$(git diff --name-only --diff-filter=U)"
              if [ -z "$conflicted" ]; then
                # 沒有衝突檔案的失敗多半是網路或權限，不是撞車。收乾淨再試一次。
                git rebase --abort || true
                echo "::notice::pull 失敗但沒有衝突檔案，第 $attempt 次重試"
                sleep 5
                continue
              fi
              echo "::warning::和另一條 workflow 撞上了，這幾個檔案讓給對方（它比較新）："
              printf '%s\n' "$conflicted" | sed 's/^/  /'
              # rebase 進行中的 --ours 指的是**已經在 main 上的那一版**，也就是
              # 對方剛推上去的那一版。改名／刪除型的衝突沒有那一版可取，就移掉。
              printf '%s\n' "$conflicted" | while read -r f; do
                git checkout --ours -- "$f" 2>/dev/null || git rm -q -- "$f" || true
              done
              git add -A
              # 讓掉 data/ratings.csv 的話，這一批**另外九十幾檔**的評等也跟著退
              # 回去了——分頁還在硬碟上，清單卻是舊的。分頁已經抓好，重算一次不
              # 必連網，所以把那幾列重新貼回對方那一版上面。期別的守門還在，
              # 對方剛抓的那一檔不會被比較舊的資料蓋掉。
              case "$conflicted" in
                *data/ratings.csv*)
                  # 讓掉分頁的那幾檔，評等也一併讓掉——它們的分頁現在是對方那一
                  # 版，我們的評等是從自己那一版算出來的，貼回去只會讓兩者不一致。
                  yielded="$(printf '%s\n' "$conflicted" \
                             | sed -n 's#^data/sheets/\([^/]*\)/.*#\1#p' | sort -u)"
                  keep="$(printf '%s\n' "${codes//,/$'\n'}" | grep -v '^$' \
                          | { [ -n "$yielded" ] && grep -vxF "$yielded" || cat; } \
                          | paste -sd, -)"
                  [ -n "$keep" ] && twsix restate --codes "$keep" || true
                  git add data/ratings.csv
                  ;;
              esac
              # 讓掉之後這個 commit 可能一點內容都不剩，那就跳過它。
              GIT_EDITOR=true git rebase --continue || git rebase --skip
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::notice::推不上去（多半是剛剛又有人推了），第 $attempt 次重試"
          done
          echo "::error::試了三次都推不上去"
          exit 1

      # 資料進了 repo，網站還沒重建。這兩步讓補好的那一批當天就出現在清單上。
      # 沒有任何一列改變的時候不重建：那是一次沒有內容差異的發布。
      - name: 建站
        if: steps.gate.outputs.skip != 'yes' && steps.commit.outputs.changed == 'yes'
        uses: ./.github/actions/build-site
        with:
          test: "false"
          setup: "false"   # 上面已經 setup 過了
          incremental: "true"


      - name: 發布
        id: deployment
        if: steps.gate.outputs.skip != 'yes' && steps.commit.outputs.changed == 'yes'
        uses: actions/deploy-pages@v4
