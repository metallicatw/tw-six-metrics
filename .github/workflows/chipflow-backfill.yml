name: 籌碼雷達回補（成交金額、法人明細、集保 15 級）

# 〔籌碼雷達〕要兩樣歷史，每晚接著補，補齊之後每一趟幾秒鐘就結束：
#
# * data/market/daily/flows/ ：每日成交金額與法人買進／賣出股數（一年約 250 天，
#   一天四個請求；證交所打太密會回 307，所以間隔拉到 5 秒）。
# * data/ownership/levels_stock/ ：集保原始 15 級（含人數）逐檔一年（51 週）。
#   一檔約一分鐘，依流動性排序——最常被看的那幾百檔最先有「大戶人數」。
#
# 兩步都**不擋**任何東西：指令永遠回 0、抓不到只留 warning。這條排程自己 commit
# 兩個目錄，網站在下一次每日排程建站時就會用上。

on:
  workflow_dispatch:
    inputs:
      flows_days:
        description: "成交金額與法人明細：往回補幾個交易日"
        required: false
        default: "300"
        type: string
      levels_minutes:
        description: "集保 15 級：這一趟最多跑幾分鐘"
        required: false
        default: "200"
        type: string
  schedule:
    # 台北 00:53，避開每日行情（15:41、21:47）與股權（週一、週四 09:37）
    - cron: "53 16 * * *"

permissions:
  contents: write

concurrency:
  group: chipflow-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[report]"
      # 這條會寫資料，bot 的 push 又不觸發 ci.yml——所以寫之前先跑一次（見 OPERATIONS.md）
      - name: 測試
        run: python scripts/run_tests.py
      - name: 成交金額與法人明細
        env:
          IN_DAYS: ${{ inputs.flows_days || '300' }}
        run: |
          case "$IN_DAYS" in ''|*[!0-9]*) IN_DAYS=300 ;; esac
          twsix fetch-flows --days "$IN_DAYS" --pause 5 --minutes 80
      - name: 集保原始 15 級（逐檔）
        env:
          IN_MIN: ${{ inputs.levels_minutes || '200' }}
        run: |
          case "$IN_MIN" in ''|*[!0-9]*) IN_MIN=200 ;; esac
          twsix backfill-levels --minutes "$IN_MIN"
      - name: Commit
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/market/daily/flows data/ownership/levels_stock
          git add data/market/daily/flows data/ownership/levels_stock
          if ! git diff --quiet; then
            echo "::error::這些檔案被改到了但沒有被 commit，請把它們加進上面的 git add："
            git diff --name-only | sed 's/^/  /'
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "::notice::沒有新的資料，歷史已經是齊的"
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          flows=$(git diff --cached --name-only -- data/market/daily/flows | wc -l)
          levels=$(git diff --cached --name-only -- data/ownership/levels_stock | wc -l)
          git commit -m "籌碼雷達回補：成交金額與法人明細 $flows 天、集保 15 級 $levels 檔"
      - name: 推送
        if: steps.commit.outputs.changed != 'no'
        uses: ./.github/actions/push-with-retry
