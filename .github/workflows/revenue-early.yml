name: 月營收先到先收（已申報的公司）

on:
  schedule:
    - cron: "43 4 1-16 * *"
    - cron: "43 10 1-16 * *"
    - cron: "43 14 1-16 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "YYYY-MM（留空＝上個月）"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[report]"

      - name: 測試
        run: python scripts/run_tests.py

      - name: 抓取已申報的月營收
        env:
          IN_MONTH: ${{ inputs.month || '' }}
        run: |
          case "$IN_MONTH" in
            '') twsix fetch-revenue-early ;;
            [0-9][0-9][0-9][0-9]-[0-9][0-9]) twsix fetch-revenue-early --month "$IN_MONTH" --force ;;
            *) echo "::error::月份格式要是 YYYY-MM：$IN_MONTH"; exit 1 ;;
          esac

      - name: Commit
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market data/sheets data/ratings.csv
          if ! git diff --quiet; then
            echo "::error::這些檔案被改到了但沒有被 commit，請把它們加進上面的 git add："
            git diff --name-only | sed 's/^/  /'
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "::notice::沒有新申報的公司"
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n="$(git diff --cached --name-only -- data/sheets | wc -l | tr -d ' ')"
          git commit -q -m "data"

      - name: 推送
        if: steps.commit.outputs.changed != 'no'
        uses: ./.github/actions/push-with-retry

      - name: 建站
        if: steps.commit.outputs.changed != 'no'
        uses: ./.github/actions/build-site
        env:
          SITE_LOGIN_USER: ${{ secrets.SITE_LOGIN_USER }}
          SITE_LOGIN_PASSWORD: ${{ secrets.SITE_LOGIN_PASSWORD }}
          SITE_LOGIN_USERS: ${{ secrets.SITE_LOGIN_USERS }}
          FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
          SITE_OWNER: ${{ secrets.SITE_OWNER }}
        with:
          incremental: "true"
          test: "false"
          setup: "false"

      - name: 發布
        if: steps.commit.outputs.changed != 'no'
        id: deployment
        uses: actions/deploy-pages@v4
