name: 存一份真實回應（候選端點）

on:
  workflow_dispatch:
    inputs:
      group:
        description: "哪一組（daily = 每日股價與三大法人；statements = 公開資訊觀測站的彙總報表；all = 全部）"
        required: false
        default: "daily"
        type: choice
        options: [daily, statements, all]
      name:
        description: "只打其中一個候選端點（填名稱，例如 twse_t86_rwd）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: 抓樣本
        env:
          IN_GROUP: ${{ inputs.group }}
          IN_NAME: ${{ inputs.name }}
        run: |
          set --
          [ -n "$IN_GROUP" ] && [ "$IN_GROUP" != all ] && set -- "$@" --group "$IN_GROUP"
          [ -n "$IN_NAME" ] && set -- "$@" --name "$IN_NAME"
          twsix probe "$@"

      - name: Commit
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/samples
          if git diff --cached --quiet; then
            echo "::notice::樣本沒有變化"
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "data"

      - name: 推送
        if: steps.commit.outputs.changed != 'no'
        uses: ./.github/actions/push-with-retry

      - name: 摘要
        if: always()
        run: |
          {
            echo "### 這一輪存下的樣本"
            echo ""
            echo "| 端點 | 位元組 | 開頭 |"
            echo "|---|---:|---|"
            python - <<'PY'
          import json, pathlib
          for f in sorted(pathlib.Path("reference/samples").glob("*.meta.json")):
              m = json.loads(f.read_text("utf-8"))
              head = (m.get("error") or m.get("head", ""))[:120].replace("|", "\\|")
              print(f"| `{m['name']}` | {m.get('bytes', 0):,} | {head} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
