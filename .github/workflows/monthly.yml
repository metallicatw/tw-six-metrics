name: monthly-rating

# 月營收於每月 10 日前公布；15 日前後季報也可能落地。跑 10-16 日這個窗口，
# 抓到就重算，抓不到就是無異動的 no-op commit。
on:
  schedule:
    - cron: "0 4 10-16 * *"        # UTC 04:00 ≈ 台北 12:00
  workflow_dispatch:

concurrency:
  group: pipeline                  # 與 daily / quarterly 互斥，避免同時寫 data/
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[all]"

      - name: 快取抓取結果
        uses: actions/cache@v4
        with:
          path: .cache/http
          key: http-${{ github.run_id }}
          restore-keys: http-

      - name: 抓月營收
        run: twsix fetch --revenue --companies

      - name: 重算評等
        run: twsix rate --out data || true

      - name: 對帳（守門）
        run: twsix verify

      # Valuation needs 股價 / 歷年本益比 / 股利, which the official feeds do
      # not yet supply.  Until `twsix fetch` covers them, only the frozen
      # samples can be valued — the site says so on any stock without one.
      - name: 估值（目前僅樣本股）
        run: twsix value --golden 5439 --out data || true

      - name: 建立網站
        run: twsix build

      - name: 提交資料快照
        run: |
          git config user.name  "twsix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "資料無異動" && exit 0
          git commit -m "data: $(date -u +%Y-%m-%d) 月營收評等更新"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
