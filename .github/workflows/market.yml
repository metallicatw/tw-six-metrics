name: 全市場官方資料（月營收／季財報）

# 抓全市場的月營收與季財報，依期別存檔累積；月營收會折回每一檔的〔營收〕分頁
# 並**重算那幾檔的評等**（cli._fold_revenue），所以有新資料的時候網站上的等第
# 會跟著變——這一條因此在有變動的時候建站發布。
#
# ## 什麼時候跑（2026-09-23 從「每天」改成「有資料會出來的日子」）
#
# 官方端點只給**最新一期**、沒有日期參數，錯過就拿不回來——所以以前選擇每天跑，
# 用不必算日子換可靠。代價是一個月裡有十五、六天，它抓回來的東西和前一天一模
# 一樣（`changed=no`）。現在照申報時程排，而每一段都留了餘裕：
#
#   * 每月 1～15 日每天：月營收 10 日前申報，11～15 日接更正與晚交的；
#     Q1（5/15）、Q2（8/14）、Q3（11/14）的截止日也都落在這一段裡。
#   * 3 月 16～31 日每天：年報截止 3/31，申報集中在月底。
#   * 每月 18、25 日：保險。接零星的更正與晚交，也接住上面哪一天被 GitHub 丟掉
#     的那一次——端點給的是「最新一期」，晚幾天抓到的還是同一期。
#
# 期別沒變的時候寫出來的位元組一模一樣，`git diff --cached --quiet` 會直接結束，
# 不留空 commit、不建站。

on:
  schedule:
    # 台北 09:17（前一天申報的，官方彙總隔天早上就有）。三條的分鐘錯開：
    # test_schedule 不准同一分鐘兩條，也避免同一天被觸發兩次。
    - cron: "17 1 1-15 * *"
    - cron: "19 1 16-31 3 *"
    - cron: "21 1 18,25 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 建站要 jinja2（有新資料的時候建）。
      - run: pip install -e ".[report]"

      # 抓回來的東西會 commit 進 repo、而且（有新的一期時）發布網站：先確認引擎
      # 是好的。bot 的 push 不觸發 ci.yml，這條路上沒有第二次機會。
      - name: 測試
        run: python scripts/run_tests.py

      - name: 抓取
        run: twsix fetch --all

      - name: Commit
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/sheets 也要加：`twsix fetch` 抓完會把月營收折回每一檔的〔營收〕
          # 分頁（見 cli._fold_revenue）。少了這一行，抓回來的那一期只會進評等
          # 清單，個股頁上的月營收永遠停在上一個逐檔抓取的月份——實際發生過，
          # 1,877 檔停在 115/07，而 workflow 每天都是綠燈。
          # data/ratings.csv 也要加：`_fold_revenue` 折完月營收之後會**接著重算
          # 那幾檔的評等**（見它的 docstring：「兩步，不是一步」）。漏掉它的症狀
          # 不是資料不見，是下面那道守門直接把整趟擋下來——
          #     ::error::這些檔案被改到了但沒有被 commit…  data/ratings.csv
          # 守門是對的，漏的是這張白名單。refresh.yml 早就列了它。
          git add data/market data/sheets data/ratings.csv \
                  data/twse_companies.csv data/tpex_companies.csv \
                  data/manifest.json
          # ⚠️ **守門要在提早 exit 的上面。**
          #
          # 它防的是「引擎寫了一個白名單沒列的檔案」。而它以前排在
          # `changed=no → exit 0` 的**下面**——於是只要白名單裡的檔案剛好都
          # 沒變（非交易日、期別沒換、補課 0 列，這在穩定狀態下是常態），
          # 那個漏掉的檔案一聲不吭地留在 runner 上，job 綠燈。
          #
          # 也就是說這道門在最需要它的那一天（引擎開始寫新檔案的第一天，
          # 而那天多半沒有別的變動）剛好是關著的。
          if ! git diff --quiet; then
            echo "::error::這些檔案被改到了但沒有被 commit，請把它們加進上面的 git add："
            git diff --name-only | sed 's/^/  /'
            exit 1
          fi
          if git diff --cached --quiet; then
            # 一個月裡有二十幾天不會有新的一期，那是正常的，不是失敗。
            echo "::notice::期別沒有變，沒有新的一期要存"
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 訊息裡放的是「新增／變動了哪幾個期別的檔案」，不是抓取當天的日期——
          # 抓取日和資料的期別不是同一件事，而 commit 想回答的是後者。
          periods="$(git diff --cached --name-only -- data/market \
                     | sed 's#.*/##; s#\.csv$##' | sort -u | paste -sd' ' -)"
          git commit -m "全市場：${periods:-$(date -u +%Y-%m-%d)}" \
                     -m "月營收與季財報，依期別存檔。"
          # 白名單式的 git add 會漏掉引擎新寫的檔案，而那件事的症狀是下一行
          # 「cannot pull with rebase: You have unstaged changes」——一句完全不提
          # 檔名的訊息。先自己講清楚。

      # 推送單獨拆成一步，用共用的重試 action。這條排程原本是裸的
      # `git pull --rebase; git push`，撞上另一條 workflow 就整趟的抓取結果一起
      # 丟掉——見 .github/actions/push-with-retry 的說明。
      - name: 推送
        if: steps.commit.outputs.changed != 'no'
        uses: ./.github/actions/push-with-retry

      # 有新的一期才建站：月營收折進去之後，那幾檔的等第與〔營收〕分頁都變了。
      # 以前這一條不建站，週末交的月營收要等到週一 16:10 的每日排程才上網站。
      - name: 建站
        if: steps.commit.outputs.changed != 'no'
        uses: ./.github/actions/build-site
        with:
          incremental: "true"
          test: "false"
          setup: "false"

      - name: 發布
        if: steps.commit.outputs.changed != 'no'
        id: deployment
        uses: actions/deploy-pages@v4
