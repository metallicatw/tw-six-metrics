name: 歷史回補（一次性排乾）

# 這條是**臨時**的，把還沒補過歷史的股票排乾之後就該關掉。
#
# ── 第一段：集保 51 週（**已經排乾，2026-09-11**）───────────────
#
# 集保的股權分散查詢頁只保留 51 週，所以那一批有硬期限：今天不問，下個月最舊的
# 四週就永遠掉出去了。常態排程（ownership.yml）是每週兩次、每次 --limit 40，
# 1,476 檔要排到十九週之後——那時候排在後面的那批已經少掉四個月。
#
# 改成「只補集保 ＋ 切成八份同時跑」之後，兩個晚上排乾：
#   2026-09-10 按下去 → 2026-09-12 早上「1,955 檔已補齊、3 檔部分、0 檔還沒補過」
# （那 3 檔是 3718／6907／7823，上市未滿一年，查詢頁上本來就沒有 51 週。）
#
# ── 第二段：董監持股（**現在跑的是這個**）───────────────────
#
# 第一段刻意只補集保（--what holders），因為公開資訊觀測站的月資料不會過期，
# 而它佔掉每一檔三分之二的時間。不會過期不代表不用補：集保排乾之後，
# 1,474 檔的董監持股不到 12 個月，個股頁上那條線是空的。
#
# 沒有期限，所以這一段刻意跑得比第一段保守：
#
#   * **四份**，不是八份。MOPS 比集保敏感得多——被判定太快之後連續好幾個小時
#     都回 307，不是慢一點再試就好（這個沙箱親身踩過）。
#   * TWSIX_MOPS_INTERVAL 2.0 秒，總和 2 req/s。
#
# 一檔 36 個月、約三分鐘，四份 × 280 分鐘 ≈ 370 檔／輪，1,474 檔約四個晚上。
# 排程每天跑，不必再按。
#
# ── 什麼時候刪掉這個檔 ────────────────────────────────
#
# 每一份的第一行都會印：
#   「股權歷史覆蓋：… 檔已補齊、0 檔部分、0 檔還沒補過」   ← 集保，已經是 0
#   「（集保已補齊的那批裡，還有 N 檔的董監持股不到 12 個月）」
# 第二行到 0 就刪掉這個檔，**不必再搬任何東西**。
#
# 原本這裡還有四個「順手補」的步驟（每日行情、三大法人、年度交易資訊、季財報），
# 而它們是常態維護、不是一次性的——留在一個名字寫著「一次性排乾」的檔案裡，等於
# 把「刪掉它」和「弄丟四件每天都要做的事」綁在一起。已經搬走了：
#
#   * 每日行情 ／ 三大法人 → daily.yml 本來就有（--days 5，穩定狀態不連網）。
#     這裡那兩步是 --days 250 的一次性深補，歷史補完就沒有存在的理由了。
#   * 年度交易資訊 ／ 季財報 → 搬進 daily.yml。兩支都只補「還沒有的那些」，
#     所以補完之後每天跑等於零個請求。
#
# 剩下的只有董監分片與 commit。刪掉這個檔不會弄丟任何東西。

on:
  schedule:
    # 每天台北 04:30（20:30 UTC）。挑這個時間是因為它跟其他每一條排程都隔得
    # 最遠——refresh 00:10、market 01:20、ownership 01:30、daily 09:10 UTC。
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "每一份最多補幾檔（預設 400；真正的煞車是 minutes，這個是保險）"
        required: false
        default: "400"
      minutes:
        description: "每一份最多跑幾分鐘（預設 280；要比 job 的 timeout 少一截）"
        required: false
        default: "280"

permissions:
  contents: write

# 跟常態的股權排程共用同一把鎖：兩邊都會寫 data/ownership 與 data/sheets，
# 同時跑就是兩份 rebase 互相踩。
concurrency:
  group: ownership
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────
  # 第一段：四份同時去公開資訊觀測站拿董監月資料。
  # **都不 commit**——各自產一份 patch，第二段再疊起來。
  # ──────────────────────────────────────────────────────────────
  shards:
    runs-on: ubuntu-latest
    # --minutes 280 會讓指令自己在兩檔之間收工，所以正常情況根本碰不到這個
    # 上限。留 340 是給收工之後產 patch 與上傳用的餘裕。**不要**用預設的
    # 360——撞上上限是硬砍，砍在寫入中途，而且那一份的成果全部不見。
    timeout-minutes: 340
    strategy:
      fail-fast: false        # 一份被擋不該讓另外七份的成果一起丟掉
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[report]"

      # 這一步刻意**不跑測試、不建站**。它只做一件事：把歷史抓回來。
      #
      # 佇列由 _ownership_queue 排序（集保沒補過的排最前面；集保都補齊之後，
      # 再照「董監缺幾個月」排），再由 --shard 隔位取，所以每一份拿到的「還缺很多」
      # 比例都一樣——不會有一份跑三秒就結束、另一份扛下全部的工作。
      #
      # `|| true`：抓到一半失敗也要把已經拿到的那些做成 patch 傳上去。
      - name: 回補董監月資料（第 ${{ matrix.shard }} 份）
        env:
          LIMIT: ${{ github.event.inputs.limit || '400' }}
          MINUTES: ${{ github.event.inputs.minutes || '280' }}
          # 四條線同時問，單片就要放慢，總和才維持在 2 req/s。
          TWSIX_MOPS_INTERVAL: "2.0"
        run: |
          twsix backfill-ownership \
            --what directors \
            --shard "${{ matrix.shard }}/4" \
            --limit "$LIMIT" \
            --minutes "$MINUTES" || true

      # 為什麼傳 patch 而不是傳整個 data/：patch 只帶「這一份真的動到的檔」。
      # 傳目錄的話，八份各自帶著一整棵 checkout 出來的樹回來，合併的時候先到
      # 的那份會被後到的那份用**舊內容**蓋掉——那正是分片最容易踩的坑。
      #
      # --binary 是必要的：存下來的是 .csv.gz。
      - name: 做成 patch
        id: patch
        run: |
          set -euo pipefail
          git add -A data/ownership data/sheets
          if git diff --cached --quiet; then
            echo "::notice::第 ${{ matrix.shard }} 份沒有補到新的歷史"
            echo "has=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --binary > "shard-${{ matrix.shard }}.patch"
          echo "has=yes" >> "$GITHUB_OUTPUT"
          echo "第 ${{ matrix.shard }} 份：$(git diff --cached --name-only | wc -l) 個檔"

      - uses: actions/upload-artifact@v4
        if: steps.patch.outputs.has == 'yes'
        with:
          name: drain-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.patch
          retention-days: 3

  # ──────────────────────────────────────────────────────────────
  # 第二段：把四份疊回來，一次 commit。
  # ──────────────────────────────────────────────────────────────
  collect:
    needs: shards
    # `always()`：就算有幾份失敗，成功的那幾份也要進版控。沒有理由因為第 3 份
    # 被擋就把另外三份丟掉。
    if: always()
    runs-on: ubuntu-latest
    # 只是套四份 patch 再 commit，幾分鐘的事。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[report]"

      - uses: actions/download-artifact@v4
        with:
          pattern: drain-shard-*
          path: patches
          merge-multiple: true

      # 四份改的是不相交的檔案，所以照順序套下去不會衝突。真的衝突就讓它停在
      # 這裡——那代表「檔案彼此不相干」這個前提被打破了，需要有人去看，不是靠
      # --3way 猜一個結果出來。
      - name: 疊回四份的成果
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for p in patches/*.patch; do
            echo "套用 $p"
            git apply --index "$p"
            found=$((found + 1))
          done
          echo "共套用 $found 份"

      - name: Commit
        id: commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ownership data/sheets
          if git diff --cached --quiet; then
            echo "::notice::這一輪沒有補到新的歷史（可能已經排乾了）"
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "歷史回補：$(date -u +%Y-%m-%d)" \
                        -m "董監持股分片回補（一次性排乾）。"
          echo "changed=yes" >> "$GITHUB_OUTPUT"

      - name: 推送
        if: steps.commit.outputs.changed == 'yes'
        uses: ./.github/actions/push-with-retry
