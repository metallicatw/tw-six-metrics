name: 建站
description: 安裝、（可選）測試、對帳、建站、上傳 Pages artifact。

# 為什麼是 composite action 而不是第四個 workflow：
#
# 「加一檔個股」原本的流程是兩個 job——fetch 抓完資料 commit，再 call pages.yml
# 去建站。而 workflow_call 起的是**另一台 runner**：重新排隊、重新 checkout、
# 重新 setup-python、重新 pip install、重新跑一次剛剛才跑過的 298 個測試，最後
# 才做那件真正要做的事（`twsix build`，四秒）。
#
# 使用者按下「立即更新」之後等的三、四分鐘裡，抓資料只占十幾秒；其餘幾乎全是
# 這段開機成本，而且付了兩次。
#
# 把它收成 composite action：建站的定義只有一份（pages.yml 和抓取的 workflow
# 共用），但它跑在**呼叫它的那個 job 裡**，所以第二次開機沒有了。

inputs:
  test:
    description: 要不要跑測試。呼叫端剛剛跑過同一份程式碼就填 "false"。
    default: "true"
  setup:
    description: 要不要裝 Python 與相依。呼叫端同一個 job 裡已經裝過就填 "false"。
    default: "true"
  save_cache:
    description: >-
      跑完之後要不要把 site/ 存回快取。互動那條路（「加一檔個股」）填 "false"：
      存一份 66 MB 的快取要十幾秒，而那十幾秒是使用者盯著螢幕在等的；排程每天跑
      六次，快取由它們保持新鮮就夠了。
    default: "true"
  incremental:
    description: >-
      只重畫內容真的變了的那幾檔（拿內容指紋跟上一次建站比對）。要搭配把 site/
      從快取取回來——沒有上一次的成果可以沿用時會自動整站重建，不會畫錯。
    default: "false"

runs:
  using: composite
  steps:
    # 同一個 job 裡已經裝過就跳過。快取命中也要好幾秒，而這幾秒是使用者按下
    # 按鈕之後真的在等的時間。pages.yml 由 push 觸發時沒人先裝過，所以預設是裝。
    - if: inputs.setup == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    # 不是 ".[all]"。all 會裝 matplotlib、pytest、ruff、mypy——四個裡面沒有一個
    # 在執行時被 import：圖表是自己畫的 SVG，測試跑的是零相依的 run_tests.py，
    # 另外兩個 CI 根本沒呼叫。matplotlib 連著 numpy、pillow、fonttools 一起拖進來，
    # 幾十 MB 解壓縮，每個 job 都付一次。實際需要的只有 jinja2。
    - if: inputs.setup == 'true'
      run: pip install -e ".[report]"
      shell: bash

    # 零相依，最先跑：引擎壞了就不必建站。
    - if: inputs.test == 'true'
      run: python scripts/run_tests.py
      shell: bash

    - name: 對帳（守門）
      run: twsix verify
      shell: bash

    # 上一次建好的網站。有它，這次就只重畫內容真的變了的那幾檔——整站重建是
    # 1,742 頁、二十幾秒，而那二十幾秒是使用者按下按鈕之後真的在等的時間。
    #
    # 快取取不到（第一次跑、被淘汰、換分支）會自動整站重建，所以這一步失敗不會
    # 讓網站少一頁；而「程式或樣板變了」也會強制整站重建，因為內容指紋只看資料。
    - if: inputs.incremental == 'true'
      uses: actions/cache/restore@v4
      with:
        path: site
        key: site-${{ github.run_id }}
        restore-keys: site-

    # 〔市場監控〕：另一個 repo（metallicatw/market-monitor）每天台北 06:30 自己
    # 產生一份 924 KB 的 HTML 報告。它是**完全自足**的——自己的 CSS、自己的版面、
    # 沒有任何相對路徑，只連一個 Chart.js CDN——所以原樣複製過來就能開，不必也
    # 不該把它塞進這個網站的殼裡（兩套 CSS 會打架，而且那個檔案每天重新產生一次，
    # 今天改對了明天格式一變又壞了）。
    #
    # 放在 `twsix build` **之前**：建站會看 `site/monitor-report.html` 在不在，
    # 決定要不要畫外殼那一頁、導覽列要不要出現那一項。取不到就都沒有，而不是一個
    # 404 的連結或一個空的框。
    #
    # 複製成 `monitor-report.html` 而不是 `monitor.html`：後者是這個網站自己畫的
    # 一頁（頁首、導覽列、搜尋框都在），中間用 iframe 把這一份嵌進去。第一版直接
    # 連過去，結果是點下去就出不來了。
    #
    # clone 失敗只是警告：那一頁不見不該讓整個網站發不出去。增量建站的快取裡若
    # 還留著上一次那一份，它會繼續在。
    - name: 帶進〔市場監控〕
      run: |
        mkdir -p site
        rm -rf /tmp/market-monitor
        if git clone --depth 1 --quiet \
             https://github.com/metallicatw/market-monitor.git /tmp/market-monitor \
           && [ -s /tmp/market-monitor/index.html ]; then
          cp /tmp/market-monitor/index.html site/monitor-report.html
          echo "〔市場監控〕$(wc -c < site/monitor-report.html) 位元組"
        else
          echo "::warning::market-monitor 取不到，這次沒有更新〔市場監控〕那一頁"
        fi
      shell: bash

    # 〔趨勢選股〕：metallicatw/tw-trend-filter 每個交易日台北 15:10 掃過全市場
    # 約 1,900 檔，產生一份自足的互動技術線圖報告（自己的 CSS、自己的版面，
    # plotly.js 走 CDN，約 1～2 MB）。
    #
    # 和上面〔市場監控〕同一套機制、同樣的理由，包括「clone 失敗只是警告」：
    # 那一頁不見不該讓整個網站發不出去。
    #
    # 它和〔市場監控〕有一個差別：那份報告裡每一檔都有一個連結指回**這個網站**
    # 的個股頁（tw-trend-filter 跑的時候用 --link-base 帶進去的）。所以兩邊互相
    # 指，而這一步只負責把檔案搬過來。
    - name: 帶進〔趨勢選股〕
      run: |
        mkdir -p site
        rm -rf /tmp/tw-trend-filter
        if git clone --depth 1 --quiet \
             https://github.com/metallicatw/tw-trend-filter.git /tmp/tw-trend-filter \
           && [ -s /tmp/tw-trend-filter/index.html ]; then
          cp /tmp/tw-trend-filter/index.html site/trend-report.html
          echo "〔趨勢選股〕$(wc -c < site/trend-report.html) 位元組"
        else
          echo "::warning::tw-trend-filter 取不到，這次沒有更新〔趨勢選股〕那一頁"
        fi
      shell: bash

    - name: 建立網站
      run: |
        if [ "${{ inputs.incremental }}" = "true" ]; then
          twsix build --incremental
        else
          twsix build
        fi
      shell: bash

    - if: inputs.incremental == 'true' && inputs.save_cache == 'true'
      uses: actions/cache/save@v4
      with:
        path: site
        key: site-${{ github.run_id }}

    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: site
