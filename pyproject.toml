[project]
name = "tw-six-metrics"
version = "0.1.0"
description = "台股六大財務指標評等引擎 — 由 Excel 活頁簿 v6.62 移植"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["taiwan", "stock", "financial-statements", "screening"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]

# The rating engine is standard-library only.  Everything below is optional
# and only needed for the layers that talk to the world.
dependencies = []

[project.optional-dependencies]
report = ["jinja2>=3.1"]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]
all = ["jinja2>=3.1", "matplotlib>=3.8", "pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
twsix = "twsix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twsix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/twsix"]
ignore_missing_imports = true
warn_unused_ignores = false
